name: Frontend CI

on:
  push:
    paths:
      - 'bdchatpro-frontend/**'
  pull_request:
    paths:
      - 'bdchatpro-frontend/**'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bdchatpro-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: bdchatpro-frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run build
        env:
          BACKEND_URL: http://localhost:3000
